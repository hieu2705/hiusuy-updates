name: Publish hiusuy Pro update

on:
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: hiusuy-release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Materialize the verified application payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, struct, zipfile
          from pathlib import Path
          root=Path('release')
          description=json.loads((root/'payload.json').read_text('utf-8'))
          manifest=json.loads((root/'latest.json').read_text('utf-8'))
          if description['version']!=manifest['version'] or description['size']!=manifest['size'] or description['sha256']!=manifest['sha256']:
              raise ValueError('Encoded payload must match the update manifest')
          parts=description['parts']
          if not isinstance(parts,list) or not 0<len(parts)<=1000 or len(set(parts))!=len(parts):
              raise ValueError('Invalid encoded payload parts')
          encoded=''
          for index,name in enumerate(parts):
              if name!=f'payload-parts/{index:03d}.b64':
                  raise ValueError('Unexpected encoded payload path')
              part=(root/name).read_text('ascii')
              if not 0<len(part)<=16000:
                  raise ValueError('Encoded part exceeds limit')
              encoded+=part
          compressed=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(compressed).hexdigest()!=description['compressedSha256']:
              raise ValueError('Compressed payload hash mismatch')
          if not 0<manifest['size']<=100*1024*1024:
              raise ValueError('Payload too large')
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as source:
              payload=source.read(manifest['size']+1)
          if len(payload)!=manifest['size'] or hashlib.sha256(payload).hexdigest()!=manifest['sha256']:
              raise ValueError('Decoded payload hash mismatch')
          (root/'app.asar').write_bytes(payload)
          fields=struct.unpack('<4I',payload[:16])
          tree=json.loads(payload[16:16+fields[3]])
          offset=8+fields[1]
          def packed(name):
              node=tree
              for part in name.split('/'):
                  node=node['files'][part]
              if node.get('unpacked') or 'files' in node:
                  raise ValueError('Required update code is not packed: '+name)
              return payload[offset+int(node['offset']):offset+int(node['offset'])+node['size']]
          if json.loads(packed('package.json'))['version']!=manifest['version']:
              raise ValueError('Application version differs from manifest')
          config=json.loads(packed('update-config.json'))
          if config!={'repository':'hieu2705/hiusuy-updates','enabled':True}:
              raise ValueError('Online update configuration is incorrect')
          with zipfile.ZipFile(root/'hiusuy-Pro-2.3.0-Cap-nhat-lan-dau.zip') as template:
              bootstrap={name:template.read(name) for name in ['Cap_nhat.cmd','bootstrap.ps1']}
          bootstrap.update({'HUONG_DAN.txt':Path('HUONG_DAN.txt').read_bytes(),'payload/app.asar':payload,'payload/manifest.json':(root/'latest.json').read_bytes(),'payload/apply-update.ps1':packed('apply-update.ps1')})
          with zipfile.ZipFile(root/f"hiusuy-Pro-{manifest['version']}-Cap-nhat-lan-dau.zip",'w',zipfile.ZIP_DEFLATED,compresslevel=6) as package:
              for name,data in bootstrap.items():
                  package.writestr(name,data)
          speech=root/'unpacked-speech'
          speech.mkdir(exist_ok=True)
          for name in ['align_worker.py','resource_paths.py','transcription.py','translation_worker.py']:
              (speech/name).write_bytes(packed('speech/'+name))
          print('Verified and materialized application code, worker code and first-update ZIP')
          PY

      - name: Verify payload and first-update package
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import zipfile

          root = Path('release')
          manifest_file = root / 'latest.json'
          if manifest_file.stat().st_size > 65536:
              raise ValueError('Update manifest exceeds 64 KiB')
          manifest = json.loads(manifest_file.read_text(encoding='utf-8-sig'))
          if not isinstance(manifest, dict):
              raise ValueError('Update manifest must be an object')
          version = manifest.get('version')
          if not isinstance(version, str) or not re.fullmatch(r'[0-9]{1,8}\.[0-9]{1,8}\.[0-9]{1,8}', version):
              raise ValueError('Version must be a stable x.y.z number')
          for field in ('sha256', 'runtimeSha256'):
              if not isinstance(manifest.get(field), str) or not re.fullmatch(r'[0-9a-f]{64}', manifest[field]):
                  raise ValueError('Invalid SHA-256 field: ' + field)
          if type(manifest.get('size')) is not int or not 0 < manifest['size'] <= 100 * 1024 * 1024:
              raise ValueError('Invalid application archive size')
          repository = os.environ['GITHUB_REPOSITORY']
          expected_url = f'https://github.com/{repository}/releases/download/v{version}/app.asar'
          if manifest.get('url') != expected_url:
              raise ValueError('Manifest URL must point to this repository and version')

          payload_file = root / 'app.asar'
          if payload_file.stat().st_size != manifest['size']:
              raise ValueError('Application archive size differs from manifest')
          payload = payload_file.read_bytes()
          if hashlib.sha256(payload).hexdigest() != manifest['sha256']:
              raise ValueError('Application archive SHA-256 differs from manifest')

          bootstrap_name = f'hiusuy-Pro-{version}-Cap-nhat-lan-dau.zip'
          expected_members = {
              'Cap_nhat.cmd', 'bootstrap.ps1', 'HUONG_DAN.txt',
              'payload/app.asar', 'payload/manifest.json', 'payload/apply-update.ps1'
          }
          with zipfile.ZipFile(root / bootstrap_name) as package:
              entries = package.infolist()
              names = [entry.filename for entry in entries]
              if len(names) != len(expected_members) or set(names) != expected_members:
                  raise ValueError('First-update ZIP contains unexpected or duplicate entries')
              for entry in entries:
                  limit = manifest['size'] if entry.filename == 'payload/app.asar' else 1024 * 1024
                  if entry.file_size > limit or stat.S_ISLNK(entry.external_attr >> 16):
                      raise ValueError('Unsafe ZIP member: ' + entry.filename)
              if package.testzip() is not None:
                  raise ValueError('First-update ZIP integrity check failed')
              if package.read('payload/app.asar') != payload:
                  raise ValueError('First-update ZIP contains a different application archive')
              inner_manifest = json.loads(package.read('payload/manifest.json').decode('utf-8-sig'))
              if inner_manifest != manifest:
                  raise ValueError('First-update ZIP contains a different update manifest')

          portable_name = ''
          portable_manifest_file = root / 'portable.json'
          if portable_manifest_file.exists():
              if portable_manifest_file.is_symlink() or portable_manifest_file.stat().st_size > 65536:
                  raise ValueError('Unsafe portable manifest')
              portable = json.loads(portable_manifest_file.read_text(encoding='utf-8-sig'))
              expected_name = f'hiusuy-Pro-{version}-Windows-portable.zip'
              base_version = portable.get('baseVersion') if isinstance(portable, dict) else None
              if base_version is not None and (not isinstance(base_version,str) or not re.fullmatch(r'[0-9]{1,8}\.[0-9]{1,8}\.[0-9]{1,8}',base_version)):
                  raise ValueError('Invalid portable base version')
              source_name = f'hiusuy-Pro-{base_version}-Windows-portable.zip' if base_version else expected_name
              if not isinstance(portable, dict) or portable.get('name') != source_name:
                  raise ValueError('Portable filename must match the release version')
              if type(portable.get('size')) is not int or not 0 < portable['size'] <= 1024 * 1024 * 1024:
                  raise ValueError('Invalid portable archive size')
              if not isinstance(portable.get('sha256'), str) or not re.fullmatch(r'[0-9a-f]{64}', portable['sha256']):
                  raise ValueError('Invalid portable archive SHA-256')
              parts = portable.get('parts')
              if not isinstance(parts, list) or not 0 < len(parts) <= 1000:
                  raise ValueError('Invalid portable part list')
              seen_parts = set()
              portable_file = root / ('portable-base.zip' if base_version else expected_name)
              if portable_file.exists() or portable_file.is_symlink():
                  raise ValueError('Portable output path already exists')
              whole_hash = hashlib.sha256()
              whole_size = 0
              with portable_file.open('xb') as assembled:
                  for part in parts:
                      if not isinstance(part, dict):
                          raise ValueError('Invalid portable part')
                      part_name = part.get('path')
                      if not isinstance(part_name, str) or not re.fullmatch(r'portable-parts/[0-9]{3,4}\.bin', part_name):
                          raise ValueError('Portable part path is not allowed')
                      if part_name in seen_parts:
                          raise ValueError('Duplicate portable part')
                      seen_parts.add(part_name)
                      if type(part.get('size')) is not int or not 0 < part['size'] <= portable['size']:
                          raise ValueError('Invalid portable part size')
                      if not isinstance(part.get('sha256'), str) or not re.fullmatch(r'[0-9a-f]{64}', part['sha256']):
                          raise ValueError('Invalid portable part SHA-256')
                      part_file = root / part_name
                      for candidate in (root, part_file.parent, part_file):
                          attributes = getattr(candidate.lstat(), 'st_file_attributes', 0)
                          if candidate.is_symlink() or attributes & getattr(stat, 'FILE_ATTRIBUTE_REPARSE_POINT', 0):
                              raise ValueError('Linked portable paths are not allowed')
                      if not part_file.is_file() or part_file.stat().st_size != part['size']:
                          raise ValueError('Portable part size differs from manifest')
                      part_hash = hashlib.sha256()
                      part_size = 0
                      with part_file.open('rb') as source:
                          while chunk := source.read(1024 * 1024):
                              part_size += len(chunk)
                              whole_size += len(chunk)
                              if part_size > part['size'] or whole_size > portable['size']:
                                  raise ValueError('Portable bytes exceed declared size')
                              part_hash.update(chunk)
                              whole_hash.update(chunk)
                              assembled.write(chunk)
                      if part_size != part['size'] or part_hash.hexdigest() != part['sha256']:
                          raise ValueError('Portable part verification failed')
              if whole_size != portable['size'] or whole_hash.hexdigest() != portable['sha256']:
                  raise ValueError('Portable archive verification failed')
              if base_version:
                  rebuilt = root / expected_name
                  with zipfile.ZipFile(portable_file) as source, zipfile.ZipFile(rebuilt,'w',zipfile.ZIP_DEFLATED,compresslevel=1) as target:
                      for info in source.infolist():
                          speech_name = info.filename.removeprefix('resources/app.asar.unpacked/speech/')
                          speech_file = root / 'unpacked-speech' / speech_name
                          if info.filename.startswith('resources/app.asar.unpacked/speech/') and speech_name in {'align_worker.py','resource_paths.py','transcription.py','translation_worker.py'}:
                              data = speech_file.read_bytes()
                          else:
                              data = payload if info.filename == 'resources/app.asar' else (Path('HUONG_DAN.txt').read_bytes() if info.filename == 'HUONG_DAN_CAP_NHAT.txt' else source.read(info.filename))
                          target.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=1)
                      original_names = set(source.namelist())
                      for speech_file in (root / 'unpacked-speech').glob('*.py'):
                          name = 'resources/app.asar.unpacked/speech/' + speech_file.name
                          if name not in original_names:
                              target.writestr(name,speech_file.read_bytes())
                  portable_file = rebuilt
              with zipfile.ZipFile(portable_file) as package:
                  entries = package.infolist()
                  names = [entry.filename for entry in entries]
                  required = {
                      'hiusuy Pro.exe', 'resources/app.asar',
                      'resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe',
                      'resources/app.asar.unpacked/node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe'
                  }
                  if len(names) != len(set(names)) or not required.issubset(names):
                      raise ValueError('Portable archive is missing application files or has duplicate entries')
                  if sum(entry.file_size for entry in entries) > 2 * 1024 * 1024 * 1024:
                      raise ValueError('Portable archive expands beyond the size limit')
                  forbidden = {'update-backups', 'profile', 'profiles', 'userdata', 'appdata'}
                  for entry in entries:
                      name = entry.filename
                      parsed = PurePosixPath(name)
                      if '\\' in name or parsed.is_absolute() or '..' in parsed.parts or stat.S_ISLNK(entry.external_attr >> 16):
                          raise ValueError('Unsafe portable ZIP entry')
                      if any(part.lower() in forbidden or part.lower().startswith('preview-profile') for part in parsed.parts):
                          raise ValueError('Portable archive contains user data or update backups')
                  if package.testzip() is not None:
                      raise ValueError('Portable ZIP integrity check failed')
                  if package.read('resources/app.asar') != payload:
                      raise ValueError('Portable archive contains a different application archive')
                  runtime_hash = hashlib.sha256()
                  with package.open('hiusuy Pro.exe') as executable:
                      while chunk := executable.read(1024 * 1024):
                          runtime_hash.update(chunk)
                  if runtime_hash.hexdigest() != manifest['runtimeSha256']:
                      raise ValueError('Portable executable differs from the supported runtime')
              portable_name = expected_name
              print(f'Verified full portable archive: {portable_name}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\ntag=v{version}\nbootstrap={bootstrap_name}\nportable={portable_name}\n')
          print(f'Verified hiusuy Pro {version}: payload, manifest and first-update ZIP match')
          PY

      - name: Upload and publish the verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.verify.outputs.version }}
          TAG: ${{ steps.verify.outputs.tag }}
          BOOTSTRAP: ${{ steps.verify.outputs.bootstrap }}
          PORTABLE: ${{ steps.verify.outputs.portable }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "hiusuy Pro $VERSION" --notes-file RELEASE_NOTES.md
          fi
          assets=(release/app.asar release/latest.json "release/$BOOTSTRAP")
          if [[ -n "$PORTABLE" ]]; then
            assets+=("release/$PORTABLE")
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --title "hiusuy Pro $VERSION" \
            --notes-file RELEASE_NOTES.md --draft=false --latest

